name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in the instance control file}

services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    hostname: ${TAILSCALE_HOSTNAME:?Set TAILSCALE_HOSTNAME}
    restart: unless-stopped
    environment:
      # Docker already supplies container DNS. Asking tailscaled to replace
      # resolv.conf conflicts with this service's intentionally read-only root.
      TS_ACCEPT_DNS: "false"
      TS_AUTHKEY: ${TS_AUTHKEY_SPEC:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME}
      TS_KUBE_SECRET: ""
      TS_SOCKET: /tmp/tailscaled.sock
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - type: bind
        source: ${TAILSCALE_STATE_DIR:?Set TAILSCALE_STATE_DIR}
        target: /var/lib/tailscale
      - type: bind
        source: ${TAILSCALE_AUTHKEY_FILE:?Set TAILSCALE_AUTHKEY_FILE}
        target: /run/secrets/tailscale-authkey
        read_only: true
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /run:rw,noexec,nosuid,nodev,size=8m,mode=0755
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          tailscale --socket=/tmp/tailscaled.sock status --json |
          grep -Eq '"BackendState"[[:space:]]*:[[:space:]]*"Running"'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  hermes:
    image: ${HERMES_IMAGE:-nousresearch/hermes-agent:latest}
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: 127.0.0.1
      HERMES_DASHBOARD_PORT: "9119"
      HOME: /opt/data
      TERM: xterm-256color
    volumes:
      - type: bind
        source: ${HERMES_DATA_DIR:?Set HERMES_DATA_DIR}
        target: /opt/data
    cap_drop:
      - ALL
    # The image starts its supervisor as root, then drops the agent to the
    # mapped hermes UID. These are the minimum bootstrap capabilities it uses.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    pids_limit: ${HERMES_PIDS_LIMIT:-4096}
    mem_limit: ${HERMES_MEMORY:-8g}
    mem_reservation: ${HERMES_MEMORY_RESERVATION:-2g}
    cpus: ${HERMES_CPUS:-4.0}
    shm_size: ${HERMES_SHM_SIZE:-2g}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 8192
        hard: 8192
    stop_grace_period: 45s
    # Name the executable explicitly. Current s6-overlay-based images can
    # otherwise treat a leading global option (such as -p) as the program.
    command: ["hermes", "-p", "${HERMES_PROFILE:?Set HERMES_PROFILE}", "gateway", "run"]
    logging:
      driver: json-file
      options:
        max-size: 25m
        max-file: "5"
